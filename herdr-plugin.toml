# herdr-better-workspace — herdr plugin manifest.
#
# Conventional install / local link:
#   herdr plugin install hamzahraihan/herdr-better-workspace
#   herdr plugin link /path/to/herdr-better-workspace
#
# Layout notes:
# - `build` compiles the picker binary into the plugin root (Go appends
#   .exe automatically when the target is Windows).
# - `startup` re-runs the keybinding installer on every herdr start, so the
#   binding self-heals if the user edits it away. It is quiet and never
#   fails the startup (warns instead).
# - No TTY in actions: the action only opens the overlay pane; the
#   fullscreen mouse TUI runs there.

id = "herdr-better-workspace"
name = "Better Workspace"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Interactive Open Workspace folder picker: browse, point, and open any directory as a herdr workspace."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["go", "build", "-o", "herdr-better-workspace", "./cmd/herdr-better-workspace"]

[[build]]
command = ["./herdr-better-workspace", "install", "--auto"]

[[startup]]
command = ["./herdr-better-workspace", "install", "--auto"]

# The picker is a fullscreen mouse TUI, and actions execute headless — so
# the action only opens the overlay pane below and exits. The popup-style
# keybinding (managed by `install`) targets this action, keeping the
# reference location-independent across reinstalls.
[[actions]]
id = "open-workspace-picker"
title = "Open Workspace"
contexts = ["workspace"]
command = ["./herdr-better-workspace", "open-picker"]

[[panes]]
id = "workspace-picker"
title = "Open Workspace"
placement = "overlay"
command = ["./herdr-better-workspace"]
